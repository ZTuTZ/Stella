# 本地开发 profile（默认激活）。
# secret 走环境变量/.env，不写在本文件；本文件只放非敏感本地覆盖。
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    com.futureself: DEBUG
    org.flywaydb: INFO

# 本地开发：健康检查显示组件详情（db/redis），便于确认基础设施状态
management:
  endpoint:
    health:
      show-details: always
