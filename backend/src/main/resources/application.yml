server:
  port: 8080

spring:
  application:
    name: future-self-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # —— MySQL 8：唯一事实源（实施文档 §6.4/§21）——
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/future_self?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # —— Flyway：数据库结构唯一变更入口 ——
  flyway:
    enabled: true
    locations: classpath:db/migration

  # —— JPA：只做读写映射，结构归 Flyway 管 ——
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # —— Redis：仅缓存/限流/幂等/锁（§17）——
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# —— 应用配置（实施文档 §21）——
app:
  auth:
    token-ttl-seconds: 7200
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    # true 时不调用微信接口，code 直接映射为确定性 mock openid（开发/演示用）
    mock-login: ${WECHAT_MOCK_LOGIN:false}
    api-base-url: ${WECHAT_API_BASE_URL:https://api.weixin.qq.com}
    timeout-ms: 5000
  admin:
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  rate-limit:
    goal-create-per-hour: ${RATE_LIMIT_GOAL_PER_HOUR:30}
    followup-per-hour: ${RATE_LIMIT_FOLLOWUP_PER_HOUR:20}
    story-generate-per-day: ${RATE_LIMIT_STORY_PER_DAY:10}
    retry-audio-per-day-per-story: ${RATE_LIMIT_RETRY_AUDIO_PER_DAY:5}
  retention:
    deleted-audio-days: ${RETENTION_DELETED_AUDIO_DAYS:30}
  generation:
    worker-delay-ms: 1500
    max-retry-count: 3
  ai:
    text:
      provider: ${AI_TEXT_PROVIDER:mock}
      base-url: ${AI_TEXT_BASE_URL:}
      api-key: ${AI_TEXT_API_KEY:}
      model: ${AI_TEXT_MODEL:}
      timeout-seconds: 60
    audio:
      provider: ${AI_AUDIO_PROVIDER:mock}
      base-url: ${AI_AUDIO_BASE_URL:}
      api-key: ${AI_AUDIO_API_KEY:}
      voice-id: ${AI_AUDIO_VOICE_ID:}
      # 腾讯云长文本语音合成（provider=tencent 时使用；secret 只来自环境变量）
      secret-id: ${AI_AUDIO_TENCENT_SECRET_ID:}
      secret-key: ${AI_AUDIO_TENCENT_SECRET_KEY:}
      region: ${AI_AUDIO_TENCENT_REGION:ap-guangzhou}
      # Mock：submit → READY 的模拟时长与测试音频目录（真实 Provider 待供应商文档）
      mock-delay-ms: ${AI_AUDIO_MOCK_DELAY_MS:3000}
      mock-fixture-dir: ${AI_AUDIO_MOCK_FIXTURE_DIR:./data/mock-audio}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/media}
    public-base-url: /media

logging:
  pattern:
    # requestId 贯穿 HTTP/任务/AI 调用日志（§23）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${APP_NAME:future-self}:%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
