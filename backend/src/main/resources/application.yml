server:
  port: 8080

spring:
  application:
    name: future-self-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# —— 应用配置结构（实施文档 §21）——
# Phase 1 补充 spring.datasource / spring.data.redis / flyway；
# Phase 2 补充 wechat 与 security；此处先固定结构与非敏感默认值。
app:
  auth:
    token-ttl-seconds: 7200
  generation:
    worker-delay-ms: 1500
    max-retry-count: 3

logging:
  level:
    root: INFO
