# 集成测试 profile：连接独立测试库 future_self_test，Redis 用 db15，不污染开发库/缓存。
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/future_self_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      database: 15

app:
  storage:
    local-dir: target/test-media
  wechat:
    mock-login: true
  admin:
    bootstrap-password: test-admin-pass
  # 测试中由用例手动驱动 orchestrator，避免后台 worker 竞争
  generation:
    worker-delay-ms: 60000
    retry-backoff-base-ms: 0
  # Mock 音频立即 READY，fixture 放进测试目录；测试固定 mock，避免继承本地 .env 的 tencent
  ai:
    audio:
      provider: mock
      mock-delay-ms: 0
      mock-fixture-dir: target/test-media/mock-audio
